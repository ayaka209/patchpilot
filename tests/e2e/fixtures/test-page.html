<!DOCTYPE html>
<html>
<head>
  <title>PatchPilot Test Page</title>
  <link rel="stylesheet" href="test-style.css">
</head>
<body>
  <h1>Test Page</h1>
  <div id="script-result"></div>
  <div id="fetch-result"></div>
  <div id="xhr-result"></div>
  <div id="dynamic-result"></div>
  <script src="test-script.js"></script>
  <script>
    document.getElementById('script-result').textContent = typeof testContent === 'string' ? testContent : '';

    // Fetch test
    fetch('/test-script.js').then(r => r.text()).then(t => {
      document.getElementById('fetch-result').textContent = t;
    });

    // XHR test
    const xhr = new XMLHttpRequest();
    xhr.open('GET', '/test-script.js');
    xhr.onload = () => {
      document.getElementById('xhr-result').textContent = xhr.responseText;
    };
    xhr.send();

    // Dynamic script test
    setTimeout(() => {
      const s = document.createElement('script');
      s.src = '/test-script.js';
      s.onload = () => {
        document.getElementById('dynamic-result').textContent = 'dynamic-loaded';
      };
      document.body.appendChild(s);
    }, 500);
  </script>
</body>
</html>
